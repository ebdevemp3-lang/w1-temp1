<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تواصل معنا</title>
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Reset styling -->
  <link rel="stylesheet" href="./main.css">

  <!-- Active Theme Style -->
  <!-- <link rel="stylesheet" href="./contact1.css" /> -->
  <!-- <link rel="stylesheet" href="./contact2.css" /> -->
  <!-- <link rel="stylesheet" href="./contact3.css" /> -->
  <link rel="stylesheet" href="./contact4.css" />

  <!-- JavaScript -->
  <script src="./contact1.js" defer></script>
</head>

<body>

  <section class="ebci20-section" id="ebci20-contact">
    
    <!-- Background decorations -->
    <div class="ebci20-bg-effects">
      <div class="ebci20-bg-orb ebci20-orb-1"></div>
      <div class="ebci20-bg-orb ebci20-orb-2"></div>
    </div>

    <!-- Header -->
    <div class="ebci20-header">
      <div class="ebci20-badge">
        <i class="fa-solid fa-headset"></i>
        <span>اتصل بنا</span>
      </div>
      <h2 class="ebci20-title">
        تواصل <span class="ebci20-title-highlight">معنا الآن</span>
      </h2>
      <p class="ebci20-subtitle">
        يسعدنا دائماً الإجابة على استفساراتك ومساعدتك في العثور على الحلول المناسبة لتطلعاتك.
      </p>
    </div>

    <!-- Contact Cards Grid -->
    <div class="ebci20-container">
      <div class="ebci20-grid">
        
        <!-- Card 1: WhatsApp -->
        <a href="https://wa.me/966566706775?text=مرحباً%20أريد%20الاستفسار" target="_blank" class="ebci20-card ebci20-anim-up ebci20-delay-1">
          <div class="ebci20-icon-wrapper">
            <i class="fa-brands fa-whatsapp"></i>
          </div>
          <h3 class="ebci20-card-title">واتساب</h3>
          <p class="ebci20-card-desc">راسلنا مباشرة وبشكل فوري</p>
          <span class="ebci20-card-value">966566706775</span>
        </a>

        <!-- Card 2: Phone -->
        <a href="tel:966566706775" class="ebci20-card ebci20-anim-up ebci20-delay-2">
          <div class="ebci20-icon-wrapper">
            <i class="fa-solid fa-phone"></i>
          </div>
          <h3 class="ebci20-card-title">اتصال مباشر</h3>
          <p class="ebci20-card-desc">تحدث هاتفياً مع فريقنا</p>
          <span class="ebci20-card-value">966566706775</span>
        </a>

        <!-- Card 3: Location -->
        <a href="https://maps.app.goo.gl/r6LH6ZBV53PH1Lu6A" target="_blank" class="ebci20-card ebci20-anim-up ebci20-delay-3">
          <div class="ebci20-icon-wrapper">
            <i class="fa-solid fa-location-dot"></i>
          </div>
          <h3 class="ebci20-card-title">موقع المقر</h3>
          <p class="ebci20-card-desc">تفضل بزيارة مكتبنا الرسمي</p>
          <span class="ebci20-card-value">جدة، المملكة العربية السعودية</span>
        </a>

      </div>
    </div>
  </section>

</body>

</html>
